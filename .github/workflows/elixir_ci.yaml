name: Elixir CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop", "feature/q67-phase-b-prereqs", "q67**", "feature/q67**", "rag**" ]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

env:
  MIX_ENV: test
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Test on OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported toolchain (mix.exs requires ~> 1.17)
          - elixir: "1.17.3"
            otp: "27.3"
          - elixir: "1.19.5"
            otp: "28.3"
          # Newest toolchain; matches local development. The lint cell runs
          # the version-independent checks (format, audit, credo) once.
          # Exactly one cell reports coverage: coveralls closes a PR's build
          # on the first non-parallel upload, so a second reporting cell
          # would 422 whenever finish times diverge (e.g. uneven caches)
          - elixir: "1.20.3"
            otp: "29.0"
            coverage: true
            lint: true
    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Elixir and Erlang
      id: beam
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}
        install-hex: true
        install-rebar: true

    - name: Restore deps and _build cache
      uses: actions/cache@v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

    - name: Clean to rule out incremental build as a source of flakiness
      if: github.run_attempt != '1'
      run: |
        mix deps.clean --all
        mix clean
      shell: sh

    - name: Install dependencies
      run: mix deps.get

    - name: Compiles without warnings
      run: mix compile --warnings-as-errors

    - name: Check Formatting
      if: matrix.lint
      run: mix format --check-formatted

    # One cell is enough: the advisory database is the same everywhere.
    - name: Audit dependencies for known vulnerabilities
      if: matrix.lint
      run: mix deps.audit

    - name: Credo
      if: matrix.lint
      run: mix credo --strict

    # Define how to cache the `plts` directory. After the first run,
    # this speeds up dialyzer runs a lot. Key on the versions setup-beam
    # actually installed, not the matrix request: a matrix "27.3" can resolve
    # to a newer patch release, and Dialyzer rejects a PLT built by another
    # version ("Old PLT file") even though dialyxir reports it up to date.
    - name: Cache PLTs
      id: cache-plts
      uses: actions/cache@v6
      with:
        path: plts
        key: ${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-plts-v4-${{ hashFiles('**/mix.lock') }}

    - name: Dialyzer
      run: mix dialyzer

    - name: Run tests
      run: ${{ (github.event_name != 'schedule' && matrix.coverage) && 'mix coveralls.github' || 'mix test' }}

  s3_test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    name: S3 MinIO tests (OTP 29 / Elixir 1.20)
    env:
      MIX_ENV: test
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Elixir and Erlang
      uses: erlef/setup-beam@v1
      with:
        elixir-version: "1.20.3"
        otp-version: "29.0"
        install-hex: true
        install-rebar: true

    - name: Restore deps and _build cache
      uses: actions/cache@v6
      with:
        path: |
          deps
          _build
        key: s3-${{ runner.os }}-1.20.3-29.0-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          s3-${{ runner.os }}-1.20.3-29.0-

    - name: Install dependencies
      run: mix deps.get

    - name: Compile
      run: mix compile

    # MinIO has archived its community releases (binaries return 410 Gone and
    # the minio/minio image is no longer published), so run a MinIO-compatible
    # server as a container. Bedrock.Test.Minio uses whatever already listens
    # on 127.0.0.1:9000 with its credentials.
    - name: Start S3-compatible server (RustFS)
      run: |
        docker run -d --name s3 -p 9000:9000 \
          -e RUSTFS_ACCESS_KEY=minio_key \
          -e RUSTFS_SECRET_KEY=minio_secret \
          -e RUSTFS_REGION=local \
          -e RUSTFS_CONSOLE_ENABLE=false \
          rustfs/rustfs:1.0.6
        for i in $(seq 60); do
          curl -s -o /dev/null http://127.0.0.1:9000/ && exit 0
          sleep 1
        done
        docker logs s3
        exit 1

    - name: Run S3 integration tests
      run: mix test --include s3 --exclude distributed

  distributed_durability:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    name: Distributed durability tests (scheduled)
    env:
      MIX_ENV: test
      BEDROCK_INCLUDE_DISTRIBUTED: "1"
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Elixir and Erlang
      uses: erlef/setup-beam@v1
      with:
        elixir-version: "1.20.3"
        otp-version: "29.0"
        install-hex: true
        install-rebar: true

    - name: Restore deps and _build cache
      uses: actions/cache@v6
      with:
        path: |
          deps
          _build
        key: distributed-${{ runner.os }}-1.20.3-29.0-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          distributed-${{ runner.os }}-1.20.3-29.0-

    - name: Install dependencies
      run: mix deps.get

    - name: Compile
      run: mix compile

    # MinIO has archived its community releases (binaries return 410 Gone and
    # the minio/minio image is no longer published), so run a MinIO-compatible
    # server as a container. Bedrock.Test.Minio uses whatever already listens
    # on 127.0.0.1:9000 with its credentials.
    - name: Start S3-compatible server (RustFS)
      run: |
        docker run -d --name s3 -p 9000:9000 \
          -e RUSTFS_ACCESS_KEY=minio_key \
          -e RUSTFS_SECRET_KEY=minio_secret \
          -e RUSTFS_REGION=local \
          -e RUSTFS_CONSOLE_ENABLE=false \
          rustfs/rustfs:1.0.6
        for i in $(seq 60); do
          curl -s -o /dev/null http://127.0.0.1:9000/ && exit 0
          sleep 1
        done
        docker logs s3
        exit 1

    - name: Run distributed durability suite
      run: mix test --include distributed test/bedrock/distributed/minio_durability_test.exs
